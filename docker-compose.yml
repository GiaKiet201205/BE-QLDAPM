services:
  postgres:
    image: postgres:16-alpine
    container_name: qldapm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlapm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qlapm_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qlapm_pgdata:/var/lib/postgresql/data

volumes:
  qlapm_pgdata:
