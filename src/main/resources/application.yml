server:
  port: 8080

spring:
  application:
    name: demo

  datasource:
    # Doi lai thanh MySQL neu can: jdbc:mysql://localhost:3306/demo_db
    url: jdbc:postgresql://localhost:5432/demo_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # doi thanh 'validate' khi len production, dung Flyway/Liquibase de quan ly schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

logging:
  level:
    org.springframework.security: INFO
