server:
  port: 8080

spring:
  application:
    name: qldapm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qlapm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Prisma migrations own the database schema.
      # Hibernate only validates that mapped entities match the migrated schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
